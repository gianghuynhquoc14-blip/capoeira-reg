<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Анкета · Капоэйра Магадан</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font:16px system-ui,sans-serif;background:var(--tg-theme-bg-color,#f5f6f8);color:var(--tg-theme-text-color,#152529);margin:0;padding:20px}main{max-width:560px;margin:auto}h1{font-size:25px}label{display:block;margin:18px 0 7px}input:not([type=checkbox]){width:100%;box-sizing:border-box;padding:13px;font:inherit;border:1px solid #a7b8ba;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;font:600 16px system-ui;background:var(--tg-theme-button-color,#147e68);color:var(--tg-theme-button-text-color,#fff)}button:disabled{opacity:.55}.muted{color:var(--tg-theme-hint-color,#53676b);line-height:1.5}details{margin-top:22px;padding:12px;border:1px solid #a7b8ba;border-radius:10px}#rules{white-space:pre-wrap;line-height:1.55}#status{line-height:1.5}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}
</style><main><h1>Olá! Добро пожаловать 🥁</h1><p class="muted">Заполни анкету для клуба «Капоэйра Магадан». После отправки её проверит тренер.</p>
<form id="registration"><label for="fio">ФИО ученика</label><input id="fio" name="fio" autocomplete="name" required minlength="3" maxlength="150">
<label for="birthDate">Дата рождения ученика</label><input id="birthDate" name="birthDate" type="date" required min="1900-01-01">
<label for="phone">Телефон для связи</label><input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="40" placeholder="+7 999 123-45-67">
<label for="parentFio">ФИО родителя / законного представителя</label><input id="parentFio" name="parentFio" maxlength="150"><p class="muted">Обязательно для несовершеннолетнего ученика.</p>
<details><summary>Правила клуба — прочитать перед отправкой</summary><div id="rules"></div></details>
<label><input id="consent" type="checkbox" required> Я ознакомился(ась) с правилами клуба и принимаю их.</label>
<button id="submit" type="submit">📝 Отправить анкету</button><p id="status" role="status" aria-live="polite"></p></form></main>
<script>
const WEBHOOK_URL = 'https://n8n.dewiar.com/webhook/capoeira-reg';
const OFFER_VERSION = "2026-09-27-v1";
const OFFER_TEXT = "ДОБРО ПОЖАЛОВАТЬ В КЛУБ «КАПОЭЙРА МАГАДАН»!\n📍 Адрес: ул. Берзина, 11\n\nМы рады видеть вас в нашей команде! Нажимая кнопку «Согласен» и отправляя свои данные, вы принимаете правила нашего клуба. Они созданы для того, чтобы тренировки были безопасными, эффективными и комфортными для всех.\n\n1. Здоровье — наш приоритет\nДля нас крайне важна безопасность вашего ребенка. Отправляя данные, вы подтверждаете, что у него нет медицинских противопоказаний к спортивным нагрузкам. Пожалуйста, не скрывайте от нас информацию о здоровье — клуб оставляет за собой право запросить справку от врача, чтобы подобрать правильный подход и не навредить.\n\n2. Абонемент, пропуски и честный подход\nОплачивая месяц, вы приобретаете Абонемент (пакет тренировок по выгодной стоимости) и бронируете место в группе за вашим ребенком.\n\nЕсли ребенок пропустил более 50% занятий, мы всегда стараемся идти навстречу адекватным ситуациям и, по возможности клуба, предлагаем варианты частичной компенсации или отработки.\n\nЕсли вы решили прервать занятия в середине месяца, мы сделаем честный перерасчет: все уже посещенные тренировки будут посчитаны по стоимости разового занятия. Если после вычета этой суммы останется разница, мы её вернем.\n\n3. Форма и командный дух\nПервый месяц: достаточно любой удобной спортивной одежды.\nДалее: для погружения в культуру капоэйры обязательны специализированные штаны, а наша клубная футболка — настоятельно рекомендуется.\nВажно: ровно за один месяц до семинаров, соревнований или аттестаций у ребенка должна быть полная форма. Это дань уважения к традициям дисциплины, без неё ученик не допускается к участию в мероприятиях.\n\n4. Наши достижения в фото и видео\nМы гордимся успехами учеников и часто снимаем тренировочный процесс для соцсетей клуба. Соглашаясь с правилами, вы разрешаете нам использовать эти кадры в ознакомительных целях. Базовые фото и видео отчеты мы отдаем родителям абсолютно бесплатно! (Участие в специальных медиа-проектах с детальной съемкой обсуждается и оплачивается отдельно).\n\n5. Доверие тренеру и безопасность\nКапоэйра — подвижная, контактная дисциплина. Мы внимательно следим за техникой безопасности на ковре, но просим вашей поддержки:\nДоверяйте нашему опыту и не вмешивайтесь в процесс тренировки (комментарии с мест отвлекают детей).\nМы не сможем нести ответственность за травмы, если они произошли из-за того, что ребенок грубо нарушил команды тренера, правила безопасности, или баловался за пределами ковра (в раздевалке, коридоре).\n\n6. Экологичный родительский чат\nНаш чат — это пространство для полезной информации, расписания и дружеской поддержки. Пожалуйста, соблюдайте тишину с 21:00 до 09:00, не присылайте спам, не обсуждайте политику и других детей. Если кто-то систематически нарушает атмосферу уважения, игнорирует рекомендации или провоцирует конфликты, клуб оставляет за собой право попрощаться и отказать в дальнейшем посещении.";
document.getElementById('rules').textContent = OFFER_TEXT;
const inviteParams=new URLSearchParams(location.search);
const regToken=inviteParams.get('regToken')||'', userId=inviteParams.get('userId')||'', platform=inviteParams.get('platform')||'tg';
const validInvite=['tg','max'].includes(platform) && /^[a-f0-9]{64}$/.test(regToken) && /^[0-9]+$/.test(userId);
history.replaceState(null,'',location.pathname+location.hash);
const tg = window.Telegram?.WebApp, button=document.getElementById('submit'), status=document.getElementById('status');
tg?.ready(); tg?.expand();
document.getElementById('birthDate').max=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Magadan',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
if(!validInvite || (platform==='tg' && !tg?.initData)){button.disabled=true;status.textContent='Открой анкету через кнопку в личном чате бота.';}
document.getElementById('registration').addEventListener('submit',async e=>{
 e.preventDefault(); if(!validInvite || (platform==='tg' && !tg?.initData))return;
 if(WEBHOOK_URL.includes('YOUR_N8N_DOMAIN')){status.textContent='Форма ещё не подключена. Напиши тренеру.';return;}
 button.disabled=true;status.textContent='Сохраняем анкету…';
 const fields=Object.fromEntries(new FormData(e.target));
 const data={...fields,platform,userId,regToken,offerVersion:OFFER_VERSION,consent:document.getElementById('consent').checked};
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
 try{
  // Simple request: no JSON Content-Type/preflight. n8n parses standard form encoding.
  const response=await fetch(WEBHOOK_URL,{method:'POST',body:new URLSearchParams(data),signal:controller.signal,credentials:'omit'});
  const result=await response.json();
  if(!response.ok || !result.ok)throw new Error(result.message||'Не удалось сохранить анкету.');
  status.textContent=result.message;button.textContent='✅ Анкета отправлена';
 }catch(error){status.textContent=error.name==='AbortError'?'Ответ задерживается. Проверь статус в боте перед повторной отправкой.':(error.message||'Ошибка связи. Проверь статус в боте перед повторной отправкой.');button.disabled=false;}
 finally{clearTimeout(timer);}
});
</script></html>
